; Export presets for Maker's Mark.
;
; COMMITTED ON PURPOSE. Godot writes this file from the editor's export dialog and many
; projects gitignore it, which is how "it exports on my machine" becomes the only truth
; anyone has. An export nobody else can reproduce is not a shipping path.
;
; embed_pck=false keeps the .pck beside the .exe rather than inside it. Both work; a
; separate .pck makes it obvious when a build ships stale data, because the two files'
; timestamps disagree instead of hiding the problem inside one binary.
;
; The exclude filter keeps the agent-playtest dev channel and the test scenes out of a
; build a human is meant to play.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, *.md"
export_path="../build/windows/MakersMark.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
; Windows file/product version metadata is numeric-only. Left empty, Godot falls back to
; config/version ("0.1.0-alpha") and warns twice per export that the suffix is invalid.
; So the human-facing version keeps its "-alpha" and the OS gets the numeric form.
application/file_version="0.1.0"
application/product_version="0.1.0"
application/company_name="Maker's Mark"
application/product_name="Maker's Mark"
application/file_description="Maker's Mark"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
