<svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- Town2D world sprite: mystic hero. 16x24, feet at y=23. Shared neutral-gray body
       silhouette (tinted to class color via Sprite2D.Modulate at runtime) with a
       staff+orb for pre-tint legibility; source for
       godot/assets/art/town2d-hero-mystic.png. -->
