<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Town2D world sprite: shop/market building. 64x64 (TownAssets2D.VenuePlaceholders
       ["market"] size; TownLayout2D's "market" venue key, nametag "Shop"). Bare id
       "market" -- the exact key queried via IconRegistry.Art("market"). Warm gold-tan
       roof (distinct hue from forge's dark roof and tavern's red roof) + an awning over
       a storefront window display of colored goods, so it reads as "shop" at a glance;
       source for godot/assets/art/market.png. -->
  <polygon points="6,24 32,8 58,24" fill="#7a6a3a" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="12" y="24" width="40" height="36" fill="#3a3446" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="14" y="24" width="36" height="4" fill="#965c3a" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="16" y="30" width="32" height="16" fill="#1e1a2a" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="19" y="36" width="5" height="7" fill="#e0913f"/>
  <rect x="27" y="36" width="5" height="7" fill="#3fb0ac"/>
  <rect x="35" y="36" width="5" height="7" fill="#6b4c9a"/>
  <rect x="43" y="36" width="5" height="7" fill="#c4b696"/>
  <rect x="26" y="48" width="12" height="12" fill="#140f1f" stroke="#d8cfe0" stroke-width="1"/>
</svg>
