<svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- Town2D world sprite: player smith, single 3/4 facing (walk anim later). 16x24,
       feet at y=23. Fixed identity (leather apron + skin tone), not tint-driven, so it
       always reads apart from the neutral-gray heroes; source for
       godot/assets/art/town2d-player.png. -->
  <rect x="5" y="17" width="3" height="6" fill="#6b4a2e" stroke="#140f1f" stroke-width="1"/>
  <rect x="9" y="17" width="3" height="6" fill="#6b4a2e" stroke="#140f1f" stroke-width="1"/>
  <polygon points="4,9 12,9 13,18 3,18" fill="#6b4a2e" stroke="#140f1f" stroke-width="1"/>
  <rect x="6" y="10" width="4" height="6" fill="#46301e" stroke="#140f1f" stroke-width="1"/>
  <circle cx="8" cy="5" r="4" fill="#c49e78" stroke="#140f1f" stroke-width="1"/>
  <line x1="13" y1="6" x2="15" y2="2" stroke="#1e1a2a" stroke-width="1"/>
  <rect x="14" y="1" width="2" height="2" fill="#d8cfe0"/>
</svg>
