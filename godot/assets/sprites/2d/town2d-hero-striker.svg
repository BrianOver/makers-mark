  <rect x="9" y="17" width="3" height="6" fill="#b8b0c6" stroke="#140f1f" stroke-width="1"/>
  <polygon points="4,9 12,9 13,18 3,18" fill="#b8b0c6" stroke="#140f1f" stroke-width="1"/>
  <circle cx="8" cy="5" r="4" fill="#b8b0c6" stroke="#140f1f" stroke-width="1"/>
  <line x1="13" y1="12" x2="15" y2="9" stroke="#b8b0c6" stroke-width="1"/>
  <line x1="13" y1="15" x2="15" y2="12" stroke="#b8b0c6" stroke-width="1"/>
</svg>
