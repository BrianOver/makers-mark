  <rect x="9" y="24" width="30" height="34" fill="#3d3242" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="19" y="42" width="10" height="16" fill="#140f1f" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="13" y="30" width="7" height="8" fill="#e0913f" opacity="0.55" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="28" y="30" width="7" height="8" fill="#e0913f" opacity="0.55" stroke="#d8cfe0" stroke-width="1"/>
