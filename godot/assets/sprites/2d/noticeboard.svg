<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <!-- Town2D world sprite: commission board. 32x48 (TownAssets2D.VenuePlaceholders
       ["noticeboard"] size). Bare id "noticeboard" -- the exact key TownLayout2D's
       noticeboard venue queries via IconRegistry.Art("noticeboard"). Two posts + tall
       parchment board with posting rule-lines so it reads as "board" without needing
       the Label nametag; source for godot/assets/art/noticeboard.png. -->
  <rect x="6" y="20" width="3" height="26" fill="#1e1a2a" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="23" y="20" width="3" height="26" fill="#1e1a2a" stroke="#d8cfe0" stroke-width="1"/>
  <rect x="3" y="4" width="26" height="22" fill="#c4b696" stroke="#d8cfe0" stroke-width="1"/>
  <line x1="7" y1="8" x2="25" y2="8" stroke="#1e1a2a" stroke-width="1"/>
  <line x1="7" y1="12" x2="25" y2="12" stroke="#1e1a2a" stroke-width="1"/>
  <line x1="7" y1="16" x2="25" y2="16" stroke="#1e1a2a" stroke-width="1"/>
  <line x1="7" y1="20" x2="25" y2="20" stroke="#1e1a2a" stroke-width="1"/>
  <polygon points="16,9 18,12 16,15 14,12" fill="none" stroke="#6b4c9a" stroke-width="1"/>
</svg>
