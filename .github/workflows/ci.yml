name: CI

# Three required lanes: sim-tests (fast, no Godot), balance-sim, engine-tests (headless Godot).
#
# sim-tests is now an AGGREGATE gate over sim-shard (4 parallel shards) + aux-tests, not a job that
# runs tests itself. That shape is deliberate: the branch ruleset requires a check literally named
# "sim-tests", so sharding under a new name would have required a branch-protection edit — an
# owner-gated operation — and would have left every open PR unmergeable in the window between the
# workflow landing and the ruleset catching up. Keeping the name means the speedup needs no ruleset
# change at all.
on:
  pull_request:
  push:
    branches: [main]

# Supersede in-flight runs on a branch when new commits land — but NEVER on main, whose push run is
# the post-merge determinism gate and must always complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The fast lane, split four ways. Partitioned by namespace with a NEGATION catch-all in shard 4,
  # so a test in a namespace nobody remembered to list still runs — the alternative (three positive
  # filters and nothing else) silently drops tests, which is the failure this repo keeps finding.
  # Shard sizes were measured, not guessed: ~303/327/356/364 test attributes.
  sim-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filter: 'Category!=Balance&(FullyQualifiedName~GameSim.Tests.Crafting.|FullyQualifiedName~GameSim.Tests.Economy.)'
          - shard: 2
            filter: 'Category!=Balance&(FullyQualifiedName~GameSim.Tests.Heroes.|FullyQualifiedName~GameSim.Tests.Drama.|FullyQualifiedName~GameSim.Tests.Expedition.)'
          - shard: 3
            filter: 'Category!=Balance&(FullyQualifiedName~GameSim.Tests.Kernel.|FullyQualifiedName~GameSim.Tests.Cli.|FullyQualifiedName~GameSim.Tests.Factions.|FullyQualifiedName~GameSim.Tests.Professions.)'
          - shard: 4
            filter: 'Category!=Balance&FullyQualifiedName!~GameSim.Tests.Crafting.&FullyQualifiedName!~GameSim.Tests.Economy.&FullyQualifiedName!~GameSim.Tests.Heroes.&FullyQualifiedName!~GameSim.Tests.Drama.&FullyQualifiedName!~GameSim.Tests.Expedition.&FullyQualifiedName!~GameSim.Tests.Kernel.&FullyQualifiedName!~GameSim.Tests.Cli.&FullyQualifiedName!~GameSim.Tests.Factions.&FullyQualifiedName!~GameSim.Tests.Professions.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Release, not Debug: the sim is pure CPU work and the Debug JIT runs it 1.5-3x slower.
      # Verified locally before this landed — the whole non-Balance suite is green under Release
      # (Failed: 0, Passed: 1594), so nothing here depended on a Debug.Assert that Release strips.
      # TreatNoTestsAsError guards the shard's own vacuous-green: a filter that matches nothing must
      # fail loudly rather than report a fast, empty success.
      - name: Fast lane shard ${{ matrix.shard }} of 4 (no Godot)
        run: >
          dotnet test sim/GameSim.Tests/GameSim.Tests.csproj -c Release
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=sim-tests-shard-${{ matrix.shard }}.trx"
          -- RunConfiguration.TreatNoTestsAsError=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-test-results-shard-${{ matrix.shard }}
          path: sim/GameSim.Tests/TestResults/*.trx

  # Off the critical path, but still merge-blocking: the sim-tests gate below requires it. Moving
  # these out of the fast lane without that dependency would have quietly stopped them blocking a
  # merge, since the ruleset only names sim-tests/balance-sim/engine-tests.
  aux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: FlavorForge test lane (stub-only, zero network)
        run: dotnet test tools/FlavorForge.Tests/FlavorForge.Tests.csproj -c Release
      - name: Fast lane — art conformance (no Godot, no IO; describe-PR definition of done)
        run: dotnet test art/GameArt.Tests/GameArt.Tests.csproj -c Release --logger "trx;LogFileName=art-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-test-results
          path: art/GameArt.Tests/TestResults/*.trx

  # The required check. Runs no tests — it exists so the ruleset's "sim-tests" contract keeps
  # meaning "the whole fast lane passed" while the work happens in parallel underneath.
  # `if: always()` is load-bearing: without it a failed shard SKIPS this job, the required check
  # never reports, and the PR hangs unmergeable instead of failing honestly.
  sim-tests:
    runs-on: ubuntu-latest
    needs: [sim-shard, aux-tests]
    if: always()
    steps:
      - name: Gate — all four shards and the aux lane
        run: |
          echo "sim-shard: ${{ needs.sim-shard.result }}"
          echo "aux-tests: ${{ needs.aux-tests.result }}"
          if [ "${{ needs.sim-shard.result }}" != "success" ]; then
            echo "::error::one or more sim-tests shards did not pass"
            exit 1
          fi
          if [ "${{ needs.aux-tests.result }}" != "success" ]; then
            echo "::error::the aux lane (FlavorForge + art conformance) did not pass"
            exit 1
          fi
          echo "fast lane green across all four shards and the aux lane"

  balance-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Balance gate — 100-day sim (placeholder until U10)
        run: dotnet test sim/GameSim.Tests/GameSim.Tests.csproj --filter "Category=Balance" --logger "trx;LogFileName=balance-sim.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-test-results
          path: sim/GameSim.Tests/TestResults/*.trx

  engine-tests:
    runs-on: ubuntu-latest
    env:
      # Floors for the shutdown-flake tolerance below. Safety comes from the COUNT, not from
      # identifying the crash: if the suite ran and this many tests passed with zero failures, a
      # SIGABRT during Godot's shutdown is cosmetic by definition, whatever exit code surfaced.
      #
      # Deliberately generous rather than exact, so adding or deleting tests needs no upkeep here.
      # They only have to sit far above the catastrophic mode they exist to catch: a failed Godot
      # rebuild silently drops every [RequireGodotRuntime] test and reports a green ~54.
      # Raised 300 -> 900 on 2026-08-10 (owner-assigned): the suite runs 1030+ now, and the floor's
      # job is not only the catastrophic ~54 silent skip — gdUnit has been measured truncating
      # MID-RUN (68 of 504 once; 533 of ~800 once), and a 300 floor waves those through. 900 keeps
      # ~13% headroom for legitimate test deletion; a wave that removes more than that updates this
      # number in the same PR, with the new suite size named here.
      ENGINE_MIN_PASSED: 900   # full suite runs 1030+; a silent skip reports ~54; mid-run truncation lands between
      GUARD_MIN_PASSED: 20     # the MainUiTests subset runs ~30
    steps:
      # LFS on the engine lane ONLY (it renders the PNGs). Checkout skips auto-download so the
      # cache below can serve objects first, protecting the free-tier 1 GiB/month LFS bandwidth;
      # `git lfs pull` then materializes anything the cache missed. sim/balance lanes stay
      # LFS-less — they only ever see pointer files (AssetConformanceTests is pure, no PNG IO).
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('godot/assets/art/**/*.png') }}
          restore-keys: lfs-
      - name: Materialize LFS art (cache hit = no download)
        run: git lfs pull
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3   # keep in sync with .godot-version
          use-dotnet: true
          include-templates: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: godot/.godot
          key: godot-import-${{ hashFiles('godot/project.godot', 'godot/**/*.tscn', 'godot/**/*.cs') }}
          restore-keys: godot-import-
      - name: Import project (known-flaky step; failures surface in the test step)
        run: godot --headless --path godot --import --quit-after 200
        continue-on-error: true
      - name: Restore csproj after import (Godot editor injects a net8 TFM downgrade)
        run: git checkout -- godot/GodotClient.csproj
      - name: Warm up Godot .NET (compile solutions, load assemblies once)
        run: |
          dotnet build Game.sln
          godot --headless --path godot --build-solutions --quit-after 2 || true
          git checkout -- godot/GodotClient.csproj
      - name: Install xvfb (gdUnit4Net launches Godot WITHOUT --headless; it needs a display)
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Engine tests (Godot under virtual display; one retry)
        run: |
          # Known flake (hit on PR #92, green on rerun): gdUnit4Net finishes and prints its
          # summary ("Failed: 0, Passed: N") but Godot's own process then SIGABRTs during
          # shutdown, exiting 134 after the results are already on disk. `-e` is on by default
          # for this shell, so `set +e` here — we need to inspect the exit code ourselves
          # instead of letting the script die on the first nonzero return.
          set +e
          export GODOT_BIN=$(which godot)

          # --settings .runsettings is DELIBERATELY NOT PASSED HERE, and this is the second,
          # informed version of that decision -- the first was an accident this PR set out to fix.
          # Both failure modes below were measured on this PR's own runs (2026-08-10):
          #   1. Passed verbatim, the file's Windows GODOT_BIN OVERRIDES the env var exported
          #      above (RunConfiguration EnvironmentVariables win inside the test host, the
          #      opposite of what .runsettings' header used to claim) -- gdUnit hunted for
          #      C:\Tools\...exe on Linux and discovered zero tests.
          #   2. With the real Linux path sed'd into the file, dotnet test printed "Test run
          #      for ...dll" and then died SILENTLY in ~3s -- no discovery error, no summary,
          #      exit 1, twice. Same GODOT_BIN value works via plain env on every green run,
          #      so the settings file itself trips the Linux adapter somewhere not yet isolated.
          # The thing --settings was meant to deliver (CompileProcessTimeout, guarding the
          # rebuild-timeout green-54 lie) is already covered downstream by ENGINE_MIN_PASSED:
          # a green 54 cannot clear a 900 floor. Local runs keep using the file, where it works.
          # If someone re-attempts this, do it in a PR whose only change is the --settings flag,
          # and expect to bisect the file section by section.

          run_engine_tests() {
            # PIPESTATUS[0] = dotnet test's own exit code, not tee's (tee itself always
            # succeeds), so the pipe through tee doesn't hide a real failure.
            xvfb-run -a dotnet test godot/tests/GodotClient.Tests.csproj --logger "trx;LogFileName=engine-tests.trx" 2>&1 | tee "$1"
            return "${PIPESTATUS[0]}"
          }

          run_engine_tests engine-tests-attempt1.log
          exit_code=$?

          if [ "$exit_code" -ne 0 ]; then
            echo "::notice::Engine tests attempt 1 exited $exit_code — retrying once (known Godot shutdown flake)."
            run_engine_tests engine-tests-attempt2.log
            exit_code=$?
          fi

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          # Both attempts failed. Decide from the RESULTS, not from the exit code.
          #
          # This block used to read `exit_code -eq 134 && grep -q "Failed: 0"`, and every part of
          # that was dead (verified against real run logs on 2026-07-29):
          #   * the 134 belongs to the inner GODOT child process. gdUnit reports it as a log LINE
          #     ("Godot Runtime Test Runner ends with exit code: 134") while the outer
          #     `xvfb-run dotnet test` pipeline returns 1, so `-eq 134` never matched.
          #   * vstest prints "Failed:     0" with PADDING, so a single-space "Failed: 0" pattern
          #     never matched either — nor did "Passed: [0-9]+" in the message below it.
          # The main step got away with it because the retry usually exits 0 and short-circuits
          # above; the sibling silent-skip guard has no retry, so it blocked a fully-green
          # docs-only PR (#279, engine step 457/457) with the message "not the tolerated shutdown
          # flake" about precisely that flake.
          last_log=engine-tests-attempt2.log
          [ -f "$last_log" ] || last_log=engine-tests-attempt1.log

          passed=$(grep -oE "Passed:[[:space:]]+[0-9]+" "$last_log" | tail -1 | grep -oE "[0-9]+")
          failed=$(grep -oE "Failed:[[:space:]]+[0-9]+" "$last_log" | tail -1 | grep -oE "[0-9]+")
          passed="${passed:-0}"
          failed="${failed:-0}"
          echo "::notice::engine results parsed from $last_log — passed=$passed failed=$failed (exit $exit_code)"

          # A silent skip cannot satisfy this: it reports ~54, far under the floor. A genuine
          # regression cannot either — it reports a nonzero Failed. A mid-run crash cannot, because
          # the tests it never reached are missing from the count.
          if [ "$failed" -eq 0 ] && [ "$passed" -ge "$ENGINE_MIN_PASSED" ]; then
            echo "::warning::engine shutdown crash tolerated (exit $exit_code) — $passed tests ran and passed, 0 failed"
            exit 0
          fi

          echo "::error::Engine tests failed for real (exit $exit_code) — passed=$passed failed=$failed, floor $ENGINE_MIN_PASSED."
          exit 1
      - name: Assert runtime suite actually ran (silent-skip guard, KTD3)
        run: |
          # Same Godot shutdown SIGABRT (exit 134 after a clean pass) that the main engine
          # step tolerates also hits this guard — it re-launches Godot via dotnet test — and
          # was reddening the whole job AFTER the suite already passed. `-e` is on by default,
          # so `set +e` to inspect the exit code ourselves.
          set +e
          export GODOT_BIN=$(which godot)
          # No --settings here either -- see the main engine step's note for the two measured
          # failure modes. This guard's own floor (GUARD_MIN_PASSED + TreatNoTestsAsError)
          # covers the green-54 lie the settings file would have guarded against.
          xvfb-run -a dotnet test godot/tests/GodotClient.Tests.csproj \
            --filter "FullyQualifiedName~MainUiTests" \
            -- RunConfiguration.TreatNoTestsAsError=true 2>&1 | tee guard.log
          exit_code="${PIPESTATUS[0]}"
          [ "$exit_code" -eq 0 ] && exit 0

          # Decide from the RESULTS, not the exit code — see the long note in the engine step above
          # for why the previous `exit_code -eq 134 && grep "Passed: [1-9]" && grep "Failed: 0"`
          # predicate could never be satisfied (wrong process layer, plus vstest pads its summary
          # with multiple spaces so neither grep matched). This step is where that cost real time:
          # with no retry to short-circuit it, it blocked a green docs-only PR.
          #
          # The guard's purpose is unchanged and is what the floor enforces: prove the RUNTIME suite
          # actually executed. A failed Godot rebuild drops every [RequireGodotRuntime] test, which
          # for this filter means 0 — nowhere near GUARD_MIN_PASSED. TreatNoTestsAsError above is
          # the second lock on the same door.
          passed=$(grep -oE "Passed:[[:space:]]+[0-9]+" guard.log | tail -1 | grep -oE "[0-9]+")
          failed=$(grep -oE "Failed:[[:space:]]+[0-9]+" guard.log | tail -1 | grep -oE "[0-9]+")
          passed="${passed:-0}"
          failed="${failed:-0}"
          echo "::notice::silent-skip guard parsed passed=$passed failed=$failed (exit $exit_code)"

          if [ "$failed" -eq 0 ] && [ "$passed" -ge "$GUARD_MIN_PASSED" ]; then
            echo "::warning::silent-skip guard: shutdown crash tolerated (exit $exit_code) — MainUiTests ran and passed ($passed)"
            exit 0
          fi

          echo "::error::silent-skip guard failed for real (exit $exit_code) — passed=$passed failed=$failed, floor $GUARD_MIN_PASSED. The runtime suite did not demonstrably run."
          exit 1
      - name: Restore csproj after tests
        if: always()
        run: git checkout -- godot/GodotClient.csproj
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== adapter dir ==="; ls -la godot/gdunit4_testadapter_v5/ 2>/dev/null || true
          echo "=== recent logs ==="; find . -name "*.log" -mmin -20 2>/dev/null | head -10
          find . -name "*.log" -mmin -20 -exec sh -c 'echo "--- $1"; tail -60 "$1"' _ {} \; 2>/dev/null | head -200
          echo "=== godot user dir logs ==="; find ~/.local/share/godot -name "*.log" 2>/dev/null -exec sh -c 'echo "--- $1"; tail -40 "$1"' _ {} \; | head -120
          echo "=== manual runner launch ==="
          RUNNER=$(find godot/gdunit4_testadapter_v5 -name "*.tscn" 2>/dev/null | head -1)
          echo "runner scene: $RUNNER"
          if [ -n "$RUNNER" ]; then timeout 40 godot --headless --path godot "res://gdunit4_testadapter_v5/$(basename $RUNNER)" 2>&1 | head -50 || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-results
          path: godot/tests/TestResults/**/*.trx
          if-no-files-found: ignore
